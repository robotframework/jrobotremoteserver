name: Java CI

on: [push, pull_request]

jobs:
  build_and_test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # test against LTS java versions:
        java: [ 25 ]
    name: Test with Java ${{ matrix.java }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Set up JDK ${{ matrix.java }}
      uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
      with:
        distribution: 'zulu'
        java-version: ${{ matrix.java }}
        cache: 'maven'
    - name: Build with Maven
      run: mvn -B verify --file pom.xml
  release:
    needs: [build_and_test]
    if: github.ref == 'refs/heads/develop' || startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    name: Release package
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Set up JDK
      uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
      with:
        distribution: 'zulu'
        java-version: 25
        cache: 'maven'
        server-id: central
        server-username-env-var: CENTRAL_USERNAME
        server-password-env-var: CENTRAL_PASSWORD
        gpg-private-key: ${{ secrets.gpg_private_key }}
        gpg-passphrase-env-var: MAVEN_GPG_PASSPHRASE

    - name: Release Maven package
      run: mvn --batch-mode -Pdeploy deploy -DskipTests --file pom.xml
      env:
        CENTRAL_USERNAME: ${{ secrets.nexus_username }}
        CENTRAL_PASSWORD: ${{ secrets.nexus_password }}
        MAVEN_GPG_PASSPHRASE: ${{ secrets.gpg_passphrase }}
